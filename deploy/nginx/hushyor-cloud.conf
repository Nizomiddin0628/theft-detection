# Hushyor AI bulut serveri — nginx (HTTPS, teskari proksi). O'rnatuvchi: deploy/install_vps.sh (docs/DEPLOY.md).
# __DOMAIN__ — panel domeni (masalan panel.dokon.uz). Sertifikat: Let's Encrypt (certbot), avtomatik yangilanadi.
# Server (uvicorn) faqat 127.0.0.1:9000 da — tashqaridan to'g'ridan-to'g'ri ochilmaydi.

limit_req_zone $binary_remote_addr zone=hushyor_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=hushyor_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=hushyor_leads:10m rate=6r/m;      # 2.6.0: saytdagi forma

upstream hushyor_cloud {
    server 127.0.0.1:9000;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;          # HTTP/2: bir nechta panel varag'i (har biri jonli oqim) ulanishlarni band qilmasin
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:hushyor_tls:10m;
    ssl_session_timeout 1d;
    server_tokens off;

    # Klip 60 MB + rasm; sekin internetli do'kondan yuklash vaqti
    client_max_body_size 70m;
    client_body_timeout 300s;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    # Faqat haqiqiy manzil (mijoz yuborgan X-Forwarded-For e'tiborga olinmaydi) — login bloki va audit uchun
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;

    location / {
        limit_req zone=hushyor_api burst=60 nodelay;
        proxy_pass http://hushyor_cloud;
    }

    # Login: tavakkal qilishni nginx ham sekinlashtiradi (ilova o'zi ham bloklaydi)
    location = /api/v1/auth/login {
        limit_req zone=hushyor_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://hushyor_cloud;
    }

    # 2.6.0: saytdagi so'rov formasi (ochiq) — kichik tana, sekin (ilova o'zi ham IP bo'yicha cheklaydi)
    location = /api/v1/leads {
        limit_req zone=hushyor_leads burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://hushyor_cloud;
    }

    # Sayt domen ildizida: kirmagan mehmon "/" ni ochsa — sayt (/sayt/), panelga kirgan (hc_session cookie) — panel.
    # Yoqish uchun quyidagi 5 qatorning izohini oching:
    # location = / {
    #     if ($cookie_hc_session = "") { return 302 /sayt/; }
    #     limit_req zone=hushyor_api burst=60 nodelay;
    #     proxy_pass http://hushyor_cloud;
    # }

    # Edge (do'kon): katta klip to'g'ridan-to'g'ri oqadi — yuklanayotganda do'kon "aloqada" ko'rinadi
    location /api/v1/edge/ {
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://hushyor_cloud;
    }

    # Jonli oqim (SSE): buferlanmaydi, uzoq ulanish
    location = /api/v1/stream {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_pass http://hushyor_cloud;
    }
}
