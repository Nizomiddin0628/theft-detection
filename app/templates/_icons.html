{% macro icon(name, size=18) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
{%- if name == 'grid' %}<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>
{%- elif name == 'eye' %}<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>
{%- elif name == 'upload' %}<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M17 8l-5-5-5 5"/><path d="M12 3v12"/>
{%- elif name == 'alert' %}<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>
{%- elif name == 'camera' %}<path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/>
{%- elif name == 'cpu' %}<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>
{%- elif name == 'send' %}<path d="M22 2L11 13"/><path d="M22 2l-7 20-4-9-9-4 20-7z"/>
{%- elif name == 'chart' %}<path d="M3 3v18h18"/><path d="M7 16v-5M12 16V8M17 16v-8"/>
{%- elif name == 'sliders' %}<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>
{%- elif name == 'activity' %}<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
{%- elif name == 'book' %}<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>
{%- elif name == 'play' %}<path d="M6 4l14 8-14 8V4z"/>
{%- elif name == 'stop' %}<rect x="5" y="5" width="14" height="14" rx="2"/>
{%- elif name == 'check' %}<path d="M20 6L9 17l-5-5"/>
{%- elif name == 'x' %}<path d="M18 6L6 18M6 6l12 12"/>
{%- elif name == 'trash' %}<path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
{%- elif name == 'download' %}<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="M7 10l5 5 5-5"/><path d="M12 15V3"/>
{%- elif name == 'refresh' %}<path d="M23 4v6h-6"/><path d="M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>
{%- elif name == 'plus' %}<path d="M12 5v14M5 12h14"/>
{%- elif name == 'logout' %}<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/>
{%- elif name == 'menu' %}<path d="M3 6h18M3 12h18M3 18h18"/>
{%- elif name == 'link' %}<path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/>
{%- elif name == 'info' %}<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
{%- elif name == 'shield' %}<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
{%- elif name == 'film' %}<rect x="2" y="2" width="20" height="20" rx="2.5"/><path d="M7 2v20M17 2v20M2 12h20M2 7h5M2 17h5M17 17h5M17 7h5"/>
{%- elif name == 'user' %}<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
{%- elif name == 'clock' %}<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>
{%- elif name == 'search' %}<circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/>
{%- elif name == 'chev-l' %}<path d="M15 18l-6-6 6-6"/>
{%- elif name == 'chev-r' %}<path d="M9 18l6-6-6-6"/>
{%- elif name == 'target' %}<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/>
{%- elif name == 'zap' %}<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>
{%- endif -%}
</svg>
{%- endmacro %}

{% macro logo(size=34) -%}
<svg width="{{ size }}" height="{{ size }}" viewBox="0 0 40 40" aria-hidden="true">
  <path d="M20 3l14 5v10c0 9.5-6.2 16.3-14 19-7.8-2.7-14-9.5-14-19V8l14-5z" fill="#0e7c6b"/>
  <path d="M9.5 20s4-6.5 10.5-6.5S30.5 20 30.5 20s-4 6.5-10.5 6.5S9.5 20 9.5 20z" fill="#fff"/>
  <circle cx="20" cy="20" r="3.8" fill="#0b1320"/>
  <circle cx="21.3" cy="18.7" r="1.2" fill="#5eead4"/>
</svg>
{%- endmacro %}
